<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="100%" height="100%">
  <!-- Definition of rich glow and gradients -->
  <defs>
    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
    <filter id="glow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="3.5" flood-color="#84cc16" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- BRAND MARK (Left logo badge, starts at X=5, Y=5) -->
  <g transform="translate(10, 8)" filter="url(#glow)">
    <!-- Circumference Circle Track Outline -->
    <path d="M 46 12 A 32 32 0 1 1 20 68" fill="none" stroke="#84cc16" stroke-width="4" stroke-linecap="round" />
    <path d="M 54 20 A 32 32 0 0 1 76 50" fill="none" stroke="#84cc16" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" />

    <!-- Stylized Gamer 'P' (White, with controller direction pad cut out) -->
    <!-- Back stem of P, plus round head -->
    <path d="M 18 20 C 18 20 38 18 48 20 C 58 22 62 30 58 40 C 54 48 44 52 34 52 L 28 52 L 20 74 L 14 74 Z" fill="#ffffff" />
    
    <!-- Inside directional joystick / D-Pad (cross shape) in black cutout -->
    <path d="M 28 32 H 34 V 38 H 28 Z M 31 29 H 31 V 41 H 31 Z" fill="#0c111e" stroke="#0c111e" stroke-width="3" stroke-linejoin="round" />
    <path d="M 25 35 H 37 M 31 29 V 41" fill="none" stroke="#0c111e" stroke-width="2.6" stroke-linecap="round" />

    <!-- Stylized Gamer 'G' (Lime Green) connected and matching the speed trail of PG -->
    <path d="M 44 44 L 68 26 C 78 26 84 34 82 44 C 80 54 70 64 56 64 C 44 64 40 56 42 49 Z" fill="url(#neonGreenGrad)" />
    
    <!-- Gamepad 4 action buttons (ABXY style) detail in G counter-space -->
    <circle cx="68" cy="34" r="1.6" fill="#0c111e" />
    <circle cx="72" cy="38" r="1.6" fill="#0c111e" />
    <circle cx="64" cy="38" r="1.6" fill="#0c111e" />
    <circle cx="68" cy="42" r="1.6" fill="#0c111e" />

    <!-- Inner controller accent stroke -->
    <path d="M 64 48 H 54 V 53 H 62" fill="none" stroke="#0c111e" stroke-width="3.2" stroke-linecap="round" />
  </g>

  <!-- LOGO TYPOGRAPHY (Right side, aligns beside PG emblem) -->
  <g transform="translate(100, 10)">
    <!-- PAKALONE futuristic high-tech display font style -->
    <text x="0" y="44" font-family="'Space Grotesk', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#ffffff" letter-spacing="1.5">
      PAKA<tspan fill="#84cc16" filter="url(#glow)">LONE</tspan>
    </text>

    <!-- GAMES subtext centered with spacing and structural line separators -->
    <line x1="2" y1="64" x2="32" y2="64" stroke="#84cc16" stroke-width="2" />
    <text x="42" y="70" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-weight="900" font-size="16" fill="#84cc16" letter-spacing="9" filter="url(#glow)">
      GAMES
    </text>
    <line x1="190" y1="64" x2="220" y2="64" stroke="#84cc16" stroke-width="2" />

    <!-- Slogan Footnote -->
    <text x="4" y="86" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="8.5" fill="#a1a1aa" letter-spacing="2.6" font-style="italic">
      PLAY MORE. SAVE MORE. WIN MORE.
    </text>
  </g>
</svg>
